<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Date & Time - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">Smart Parking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('book') }}">← Back to Slot Selection</a>
                <span class="navbar-text me-3">Welcome, {{ current_user.email }}!</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom">
                    <div class="card-header text-center">
                        <h3>Select Date & Time</h3>
                        <p class="text-muted mb-0">Choose your booking duration and time</p>
                    </div>
                    <div class="card-body">
                        <div id="selected-slot-info" class="alert alert-info mb-4">
                            <!-- Selected slot info will be shown here -->
                        </div>

                        <form id="datetime-form">
                            <div class="mb-3">
                                <label for="booking-date" class="form-label">Booking Date</label>
                                <input type="date" class="form-control" id="booking-date" min="{{ today }}" required>
                            </div>

                            <div class="mb-3">
                                <label for="duration" class="form-label">Duration</label>
                                <select class="form-control" id="duration" required>
                                    <option value="1">1 Hour</option>
                                    <option value="2">2 Hours</option>
                                    <option value="3">3 Hours</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="start-time" class="form-label">Start Time</label>
                                <select class="form-control" id="start-time" required>
                                    <!-- Time options will be populated by JavaScript -->
                                </select>
                            </div>

                            <div class="text-center">
                                <button type="button" class="btn btn-secondary me-2" onclick="goBack()">Back</button>
                                <button type="submit" class="btn btn-primary">Continue to Payment</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSlotId, selectedSlotName, selectedPricePerHour, vehicleNumber;

        function loadSelectedSlotInfo() {
            selectedSlotId = sessionStorage.getItem('selectedSlotId');
            selectedSlotName = sessionStorage.getItem('selectedSlotName');
            selectedPricePerHour = parseFloat(sessionStorage.getItem('selectedPricePerHour'));
            vehicleNumber = sessionStorage.getItem('vehicleNumber');

            if (!selectedSlotId || !selectedSlotName) {
                // No slot selected, redirect back
                window.location.href = '/book';
                return;
            }

            document.getElementById('selected-slot-info').innerHTML = `
                <strong>Selected Slot:</strong> ${selectedSlotName}<br>
                <strong>Vehicle Number:</strong> ${vehicleNumber || 'Not provided'}<br>
                <strong>Price per Hour:</strong> $${selectedPricePerHour}
            `;

            // Populate time options
            populateTimeOptions();
        }

        function populateTimeOptions() {
            const timeSelect = document.getElementById('start-time');
            timeSelect.innerHTML = '';

            for (let hour = 0; hour < 24; hour++) {
                for (let minute = 0; minute < 60; minute += 30) {
                    const timeString = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                    const option = document.createElement('option');
                    option.value = timeString;
                    option.textContent = timeString;
                    timeSelect.appendChild(option);
                }
            }
        }

        function goBack() {
            window.location.href = '/book';
        }

        document.getElementById('datetime-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const date = document.getElementById('booking-date').value;
            const duration = document.getElementById('duration').value;
            const startTime = document.getElementById('start-time').value;

            if (!date || !duration || !startTime) {
                alert('Please fill in all fields');
                return;
            }

            // Store datetime info
            sessionStorage.setItem('bookingDate', date);
            sessionStorage.setItem('bookingDuration', duration);
            sessionStorage.setItem('bookingStartTime', startTime);

            // Navigate to payment page
            window.location.href = '/book/payment';
        });

        // Initialize the page
        loadSelectedSlotInfo();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
