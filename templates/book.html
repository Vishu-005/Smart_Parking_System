<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parking Slot - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .slot-available {
            background: #d4edda;
            border-color: #c3e6cb;
        }
        .slot-occupied {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
        .selected-slot {
            border: 3px solid #007bff !important;
            box-shadow: 0 0 15px rgba(0,123,255,0.3) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">Smart Parking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">← Back to Dashboard</a>
                <span class="navbar-text me-3">Welcome, {{ current_user.email }}!</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Select Parking Slot</h1>
        <p class="text-center text-muted mb-4">Choose an available parking slot to continue with your booking</p>

        <div id="available-slots" class="row justify-content-center">
            <!-- Slots will be loaded here -->
        </div>

        <div class="text-center mt-4">
            <div class="mb-3">
                <label for="vehicle-number" class="form-label">Vehicle Number</label>
                <input type="text" id="vehicle-number" class="form-control mx-auto"
                        style="max-width: 300px;"
                        placeholder="e.g., TN01AB1234" required>
                <div id="vehicle-number-error" class="text-danger mt-1" style="display:none;">Please enter your vehicle number.</div>
            </div>
            <button id="continue-btn" class="btn btn-primary btn-lg" onclick="continueToDateTime()" disabled>
                Book Slot
            </button>
        </div>
    </div>

    <script>
        let selectedSlotId = null;
        let selectedSlotName = null;
        let selectedPricePerHour = null;

        async function loadAvailableSlots() {
            const slotsContainer = document.getElementById("available-slots");
            slotsContainer.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="sr-only">Loading...</span></div><p>Loading available slots...</p></div>';

            try {
                const response = await fetch("/api/slots");
                const slots = await response.json();

                slotsContainer.innerHTML = "";

                // Only show slots with slot_number 1-6 (P1-P6)
                const availableSlots = slots.filter(slot => slot.available && slot.slot_number >= 1 && slot.slot_number <= 6);

                if (availableSlots.length === 0) {
                    slotsContainer.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-warning text-center">
                                <h4>No Available Slots</h4>
                                <p>All parking slots are currently occupied. Please try again later.</p>
                                <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Dashboard</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                availableSlots.forEach(slot => {
                    const col = document.createElement("div");
                    col.className = "col-md-6 col-lg-4 mb-4";
                    
                    let slotTypeLabel = '';
                    let badgeColor = 'secondary';
                    
                    if (slot.slot_type === 'ev') {
                        slotTypeLabel = ' ⚡ EV Charging';
                        badgeColor = 'success';
                    } else if (slot.slot_type === 'handicapped') {
                        slotTypeLabel = ' ♿ Handicapped';
                        badgeColor = 'info';
                    }
                    
                    col.innerHTML = `
                        <div class="card h-100 card-custom slot-card" onclick="selectSlot(${slot.id}, '${slot.location}', ${slot.price_per_hour})">
                            <div class="card-body text-center">
                                <h4 class="card-title">Slot ${slot.slot_number}${slotTypeLabel}</h4>
                                <p class="card-text">
                                    <strong>Type:</strong> <span class="badge bg-${badgeColor}">${slot.slot_type.charAt(0).toUpperCase() + slot.slot_type.slice(1)}</span><br>
                                    <strong>Location:</strong> ${slot.location}<br>
                                    <strong>Price:</strong> $${slot.price_per_hour}/hour<br>
                                    <span class="badge bg-success">Available</span>
                                </p>
                                <div class="mt-3">
                                    <small class="text-muted">Click to select this slot</small>
                                </div>
                            </div>
                        </div>
                    `;
                    slotsContainer.appendChild(col);
                });

            } catch (error) {
                console.error("Error loading available slots:", error);
                slotsContainer.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">
                            <h4>❌ Failed to load slots</h4>
                            <p>Error: ${error.message}</p>
                            <button class="btn btn-warning" onclick="loadAvailableSlots()">Retry</button>
                        </div>
                    </div>
                `;
            }
        }

        function selectSlot(slotId, slotName, pricePerHour) {
            selectedSlotId = slotId;
            selectedSlotName = slotName;
            selectedPricePerHour = pricePerHour;

            // Remove selection from all cards
            document.querySelectorAll('.slot-card').forEach(card => {
                card.classList.remove('selected-slot');
            });

            // Add selection to clicked card
            event.currentTarget.classList.add('selected-slot');

            // Enable continue button
            document.getElementById('continue-btn').disabled = false;
        }

        function continueToDateTime() {
            if (!selectedSlotId) {
                alert("Please select a parking slot first.");
                return;
            }
            const vehicleNumberInput = document.getElementById('vehicle-number');
            const vehicleNumber = vehicleNumberInput.value.trim();
            const errorDiv = document.getElementById('vehicle-number-error');
            if (!vehicleNumber) {
                errorDiv.style.display = 'block';
                vehicleNumberInput.classList.add('is-invalid');
                vehicleNumberInput.focus();
                return;
            } else {
                errorDiv.style.display = 'none';
                vehicleNumberInput.classList.remove('is-invalid');
            }
            // Store selection in sessionStorage for next page
            sessionStorage.setItem('selectedSlotId', selectedSlotId);
            sessionStorage.setItem('selectedSlotName', selectedSlotName);
            sessionStorage.setItem('selectedPricePerHour', selectedPricePerHour);
            sessionStorage.setItem('vehicleNumber', vehicleNumber);
            // Navigate to date/time selection page
            window.location.href = '/book/datetime';
        }

        // Initialize the page
        loadAvailableSlots();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
